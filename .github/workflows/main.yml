name: Verify and Push

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint code
        uses: golangci/golangci-lint-action@v9
      - name: Run tests
        run: make test
      # Only the upstream repository pushes its latest image to Docker Hub;
      # forks publish theirs for v* tags from image.yml.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.repository == 'cloudlena/s3manager'
        uses: docker/login-action@v4
        with:
          username: cloudlena
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up container image build
        if: github.event_name == 'push' && github.repository == 'cloudlena/s3manager'
        uses: docker/setup-buildx-action@v4
      - name: Build and push container image
        if: github.event_name == 'push' && github.repository == 'cloudlena/s3manager'
        uses: docker/build-push-action@v7
        with:
          file: Containerfile
          push: true
          tags: cloudlena/s3manager:latest
          platforms: linux/amd64,linux/arm64
