name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the GitHub release and upload its assets.
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
      - run: make test
      - uses: docker/login-action@v4
        with:
          username: cloudlena
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Output binary hashes
        id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"
      - name: Output image name and digest
        id: image
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          image_and_digest=$(echo "$ARTIFACTS" | jq -r 'first(.[] | select(.type == "Docker Image") | .path + "@" + .extra.Digest)')
          echo "name=$(echo "$image_and_digest" | cut -d@ -f1 | cut -d: -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$image_and_digest" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

  binary-provenance:
    name: Binary provenance
    needs: release
    permissions:
      actions: read # Needed to read the workflow path.
      id-token: write # Needed to sign the provenance.
      contents: write # Needed to upload the provenance to the release.
    # Must be referenced by tag, not by commit SHA: the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true

  image-provenance:
    name: Image provenance
    needs: release
    permissions:
      actions: read # Needed to read the workflow path.
      id-token: write # Needed to sign the provenance.
      packages: write # Required by the generator for registry logins.
    # Must be referenced by tag, not by commit SHA: the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.release.outputs.image }}
      digest: ${{ needs.release.outputs.digest }}
      registry-username: cloudlena
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
